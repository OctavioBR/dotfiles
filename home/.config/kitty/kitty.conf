# vim:fileencoding=utf-8:foldmethod=marker
include current-theme.conf

cursor_shape block
cursor_shape_unfocused hollow

font_family      family='MesloLGS Nerd Font Mono' postscript_name=MesloLGSNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto

# Split terminal horizontally/vertically (Alt+Minus/Plus)
enabled_layouts splits,stack
map alt+minus launch --location=hsplit --cwd=current
map alt+equal launch --location=vsplit --cwd=current

# clipboard
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

mouse_map ctrl+left click ungrabbed mouse_handle_click link
mouse_map left click      ungrabbed no-op

# ------ Windows ------
map ctrl+t launch --type=tab --cwd=current
map ctrl+w close_window

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

map shift+alt+down  resize_window taller 2
map shift+alt+up    resize_window shorter 2
map shift+alt+right resize_window narrower 2
map shift+alt+left  resize_window wider 2

map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map shift+home      scroll_home
map shift+end       scroll_end

# ------ Effects ------
# background_opacity 0.8
# background_blur 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

tab_bar_style       powerline
tab_powerline_style slanted

# ------ Scrollback ------
scrollback_lines 10000
scrollback_pager_history_size 50000
scrollbar scrolled
scrollbar_interactive yes
scrollbar_width 1
scrollbar_handle_opacity 0.9
scrollbar_gap 0.3
scrollbar_min_handle_height 1
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.scrollback_pager
map ctrl+shift+e launch --type=overlay --stdin-source=@screen_scrollback code -
map ctrl+shift+h show_scrollback
# map ctrl+f       launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fzf --no-sort --no-mouse --exact --ignore-case
map ctrl+shift+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id # https://github.com/trygveaa/kitty-kitten-search
map ctrl+f       show_scrollback
# map ctrl+f launch --type=overlay --stdin-source=@screen_2048 fzf --ansi --tac --no-sort --exact --color=hl:underline:bold,hl+:yellow:bold --query=""





